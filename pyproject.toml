[project]
name = "nnj-topology"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "gudhi>=3.12.0",
    "h3>=4.5.0",
    "hydra-core>=1.3.3",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "osmnx>=2.1.0",
    "pandas>=3.0.3",
    "persim>=0.3.8",
    "pot>=0.9.6.post1",
    "rasterio>=1.4.4",
    "ripser>=0.6.15",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
